name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libayatana-appindicator3-dev librsvg2-dev

      - name: Install app deps
        run: pnpm install --frozen-lockfile

      - name: Download cloudflared sidecar
        run: node scripts/download-cloudflared.mjs

      - name: Build (dev / unsigned)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: pnpm tauri

      - name: Build tunneldash-cli
        shell: bash
        run: |
          cd src-tauri
          cargo build --release --features cli --bin tunneldash-cli
          BIN="target/release/tunneldash-cli"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          cp "$BIN" "$GITHUB_WORKSPACE/tunneldash-cli-${{ runner.os }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tauri-bundles-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**
            tunneldash-cli-${{ runner.os }}
          if-no-files-found: error
