name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ''
            args: ''
          - platform: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libayatana-appindicator3-dev librsvg2-dev

      - name: Install app deps
        run: pnpm install --frozen-lockfile

      - name: Download cloudflared sidecar
        run: node scripts/download-cloudflared.mjs

      - name: Build and publish to GitHub Releases
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: TunnelDash ${{ github.ref_name }}
          releaseBody: |
            ## TunnelDash ${{ github.ref_name }}

            Installers for macOS (Apple Silicon + Intel), Windows, and Linux. cloudflared is bundled - no manual install.

            ### Features
            - Cloudflare tunnels: verify your token, list tunnels, flip them on/off
            - SSH Sessions tab: native terminal launching (password or SSH-key auth)
            - Saved Credentials manager + encrypted cross-device sync (AES-256-GCM)
            - Menu bar tray + optional launch-at-login
            - `tunneldash-cli` for list/status/connect/stop from the terminal or AI agents
            - Auto update notice: a new version opens the releases page once, then shows a banner

            ### Endpoints Used
            - `GET /accounts` (Auth check)
            - `GET /.../cfd_tunnel` (List tunnels)
            - `GET /.../configurations` (Read ingress rules)
            - `PATCH /.../cfd_tunnel` (Save port assignments + credential vault)

            > Screenshots: see the [README](https://github.com/MauroDruwel/TunnelDashDesktop#-screenshots).
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
          releaseDraft: ${{ !(contains(github.ref_name, 'pre') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta')) }}
          args: ${{ matrix.args }}

      - name: Build tunneldash-cli
        shell: bash
        run: |
          cd src-tauri
          TARGET="${{ matrix.target }}"
          if [ -n "$TARGET" ]; then
            cargo build --release --features cli --bin tunneldash-cli --target "$TARGET"
            BIN="target/$TARGET/release/tunneldash-cli"
          else
            cargo build --release --features cli --bin tunneldash-cli
            BIN="target/release/tunneldash-cli"
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          cp "$BIN" "$GITHUB_WORKSPACE/tunneldash-cli-${{ runner.os }}"

      - name: Upload CLI to release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          files: tunneldash-cli-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
