name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag and app versions
        run: node scripts/check-versions.mjs --release

  build:
    needs: [quality, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles msi
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install app deps
        run: pnpm install --frozen-lockfile

      - name: Download cloudflared sidecar
        env:
          CLOUDFLARED_TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/download-cloudflared.mjs

      - name: Verify sidecar and run native tests
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          "./src-tauri/binaries/cloudflared-$TARGET$suffix" --version
          cargo test --manifest-path src-tauri/Cargo.toml --locked --features cli --target "$TARGET"

      - name: Build installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: .
          tauriScript: pnpm tauri
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[platform]-[arch]-[bundle]"
          args: ${{ matrix.args }}

      - name: Build tunneldash-cli
        shell: bash
        run: |
          cd src-tauri
          TARGET="${{ matrix.target }}"
          if [ -n "$TARGET" ]; then
            cargo build --locked --release --features cli --bin tunneldash-cli --target "$TARGET"
            BIN="target/$TARGET/release/tunneldash-cli"
          else
            cargo build --release --features cli --bin tunneldash-cli
            BIN="target/release/tunneldash-cli"
          fi
          SUFFIX=""
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; SUFFIX=".exe"; fi
          "./$BIN" --help
          cp "$BIN" "$GITHUB_WORKSPACE/tunneldash-cli-$TARGET$SUFFIX"

      - name: Stage CLI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-${{ matrix.target }}
          path: tunneldash-cli-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
      - name: Create release after all builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite its assets." >&2
            exit 1
          fi
          mkdir -p publish
          stage() {
            local pattern="$1" name="$2"
            local -a matches
            mapfile -d '' matches < <(find release-assets -type f -iname "$pattern" -print0)
            if (( ${#matches[@]} != 1 )); then
              echo "Expected one artifact matching $pattern; found ${#matches[@]}" >&2
              return 1
            fi
            cp "${matches[0]}" "publish/$name"
          }
          stage '*aarch64.dmg' TunnelDash-macos-arm64.dmg
          stage '*x64.dmg' TunnelDash-macos-x64.dmg
          stage '*.msi' TunnelDash-windows-x64.msi
          stage '*.AppImage' TunnelDash-linux-x64.AppImage
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc.exe; do
            stage "tunneldash-cli-$target" "tunneldash-cli-$target"
          done
          flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then flags=(--prerelease); fi
          gh release create "$RELEASE_TAG" publish/* --verify-tag --generate-notes "${flags[@]}"
