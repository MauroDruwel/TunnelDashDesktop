[package]
name = "tunneldash"
version = "0.4.0"
description = "Tiny Cloudflare Tunnel sidekick with native SSH launching"
authors = ["Mauro Druwel"]
edition = "2021"
license = "MIT"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tunneldash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The CLI bin is feature-gated so `tauri build` only ever produces the GUI
# binary — multiple visible bins confuse Tauri's bundler (wrong executable
# gets bundled). Build the CLI with: `cargo build --release --features cli`
cli = []

[[bin]]
name = "tunneldash"
path = "src/main.rs"

[[bin]]
name = "tunneldash-cli"
path = "src/bin/tunneldash-cli.rs"
required-features = ["cli"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
once_cell = "1"
keyring = "3"
aes-gcm = "0.11"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tokio = { version = "1", features = ["sync", "macros", "rt", "net", "time"] }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
